<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 — Никс · Страница недоступна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--s:#151518;--t:#f3f1ee;--m:#9b9ba4;--b:#f6821f;--r:#ff4d4f;--l:rgba(255,255,255,.12);--ff:'Manrope',system-ui,sans-serif;--fd:'Unbounded','Manrope',sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f2;--s:#fff;--t:#161618;--m:#5f5f68;--l:rgba(0,0,0,.14)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font:400 1rem/1.7 var(--ff);display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;width:60vmax;height:60vmax;left:50%;top:50%;translate:-50% -50%;background:radial-gradient(circle,rgba(246,130,31,.16),transparent 60%);pointer-events:none;animation:br 6s ease-in-out infinite}
@keyframes br{50%{opacity:.55;scale:1.08}}
.box{position:relative;text-align:center;width:min(640px,100%);padding:56px 28px 46px;animation:in .8s var(--ease) both}
@keyframes in{from{opacity:0;transform:perspective(1000px) rotateX(8deg) translateY(30px) scale(.97)}}
.box>i{position:absolute;width:38px;height:38px;border:3px solid var(--r);animation:pl 2.4s ease-in-out infinite}
.box>i:nth-of-type(1){top:0;left:0;border-right:0;border-bottom:0}
.box>i:nth-of-type(2){top:0;right:0;border-left:0;border-bottom:0}
.box>i:nth-of-type(3){bottom:0;left:0;border-right:0;border-top:0}
.box>i:nth-of-type(4){bottom:0;right:0;border-left:0;border-top:0}
@keyframes pl{50%{opacity:.35;transform:scale(.88)}}
.rec{position:absolute;top:14px;left:50%;translate:-50% 0;font:700 .72rem var(--ff);letter-spacing:.18em;color:var(--r);display:flex;align-items:center;gap:7px}
.rec:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--r);animation:bk 1.1s steps(2) infinite}
@keyframes bk{50%{opacity:0}}
.n{font:700 clamp(5rem,26vw,10rem)/1 var(--fd);letter-spacing:-.04em;display:flex;justify-content:center;align-items:center;gap:.02em;margin:10px 0 6px}
.n span{display:inline-block;animation:fl 3.2s var(--ease) infinite}
.n span:nth-child(2){color:var(--b);animation-delay:.25s}
.n span:nth-child(3){animation-delay:.5s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font:700 clamp(1.2rem,4.4vw,1.7rem)/1.3 var(--fd);margin-bottom:12px}
p{color:var(--m);max-width:44ch;margin:0 auto 28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:99px;background:var(--b);color:#111;font-weight:700;text-decoration:none;border:1px solid var(--b);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(246,130,31,.35)}
.btn.ghost{background:transparent;color:var(--t);border-color:var(--l)}
.btn.ghost:hover{border-color:var(--b);box-shadow:none}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.sm{margin-top:22px;font-size:.8rem;color:var(--m);opacity:.8}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="box">
  <i></i><i></i><i></i><i></i>
  <span class="rec">REC</span>
  <div class="n" aria-label="404"><span>4</span><span>0</span><span>4</span></div>
  <h1>Страница удалена или сейчас обновляется</h1>
  <p>Мы уже проявляем новые кадры. Загляните чуть позже, и всё снова будет на месте.</p>
  <div class="btns">
    <a class="btn" id="home" href="/">На главную</a>
    <a class="btn ghost" href="https://t.me/objektivniksa" target="_blank" rel="noopener">Telegram-канал</a>
  </div>
  <div class="sm">Ошибка 404 · Никс — Фотограф</div>
</main>
<script>
/* ссылка «На главную» работает и на github.io/название-репозитория/, и на своём домене */
(function(){var a=document.getElementById('home'),p=location.pathname.split('/')[1];
a.href=(location.hostname.slice(-9)==='github.io'&&p)?'/'+p+'/':'/'})();
</script>
</body>
</html>
